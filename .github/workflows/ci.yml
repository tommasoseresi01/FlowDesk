name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # I test di integrazione girano su un SQL Server vero, non su un database finto.
    # Il container vive solo per questo job: la password non protegge nulla di reale.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-only-Passw0rd!
        ports:
          - 1433:1433
    env:
      FLOWDESK_TEST_CONNECTION: Server=localhost,1433;Database=FlowDesk_Test;User Id=sa;Password=Ci-only-Passw0rd!;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FlowDesk.slnx

      - name: Build
        run: dotnet build FlowDesk.slnx --configuration Release --no-restore

      - name: Check formatting
        run: dotnet format FlowDesk.slnx --verify-no-changes --no-restore

      # Il fixture dei test riprova finché SQL Server non è pronto.
      - name: Test
        run: dotnet test FlowDesk.slnx --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Gli script di installazione dei pacchetti restano disattivati: quello di una
      # dipendenza indiretta di admin-lte (summernote) lancia "husky" e fallisce.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

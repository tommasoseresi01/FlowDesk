name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FlowDesk.slnx

      - name: Build
        run: dotnet build FlowDesk.slnx --configuration Release --no-restore

      - name: Check formatting
        run: dotnet format FlowDesk.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test FlowDesk.slnx --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Gli script di installazione dei pacchetti restano disattivati: quello di una
      # dipendenza indiretta di admin-lte (summernote) lancia "husky" e fallisce.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

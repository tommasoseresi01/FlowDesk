name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FlowDesk.slnx

      - name: Build
        run: dotnet build FlowDesk.slnx --configuration Release --no-restore

      - name: Check formatting
        run: dotnet format FlowDesk.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test FlowDesk.slnx --configuration Release --no-build
